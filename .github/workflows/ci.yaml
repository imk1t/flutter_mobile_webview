name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# CI is kept minimal: Dart/lint jobs run on every PR, while the Android and iOS build/test
# jobs (needs: dart, `if: ... full-ci`) run only on a PR labelled `full-ci` or when started
# manually (Actions > CI > Run workflow). Run `mise run check` / `mise run check:ios` locally.

# Cancel superseded runs of a PR so they don't hold the few macOS runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test pub.dev publication detection
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
      - run: flutter pub get
      # Pigeon output (*.g.dart) is committed as generated and not reformatted.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v '\.g\.dart$')
      - name: Check Pigeon output is up to date
        run: |
          dart run pigeon --input pigeons/messages.dart
          git diff --exit-code
      - run: flutter analyze
      - run: flutter test
      # README links to repo files (README.ja.md, AGENTS.md, ...) dangle on the generated
      # landing page; those warnings are expected. Any other warning fails the job.
      - name: Check dartdoc
        run: |
          dart doc --validate-links 2>&1 | tee "$RUNNER_TEMP/dartdoc.log"
          unexpected=$(awk '
            /^[[:space:]]*(warning|error):/ { if (pending != "") print pending; pending = $0; next }
            /^[[:space:]]+linked to from package-advanced_webview:/ && pending ~ /broken link to/ { pending = ""; next }
            END { if (pending != "") print pending }
          ' "$RUNNER_TEMP/dartdoc.log")
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            echo '::error::dart doc reported warnings outside the README landing page'
            exit 1
          fi
      - name: Validate package for pub.dev
        run: flutter pub publish --dry-run

  kotlin-lint:
    runs-on: ubuntu-latest
    env:
      KTLINT_VERSION: 1.8.0
      KTLINT_SHA256: a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ktlint
        run: |
          curl -sSLf -o "$RUNNER_TEMP/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/$KTLINT_VERSION/ktlint"
          echo "$KTLINT_SHA256  $RUNNER_TEMP/ktlint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/ktlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Pigeon output (*.g.kt) is committed as generated and not linted.
      # The format step prints the diff `ktlint --format` would apply; the lint
      # step then reports anything that cannot be fixed automatically.
      - name: Check formatting
        run: |
          ktlint --format --relative $(git ls-files '*.kt' '*.kts' | grep -v '\.g\.kt$') || true
          git diff --exit-code
      - name: ktlint
        if: ${{ !cancelled() }}
        run: |
          git checkout -- .
          ktlint --relative $(git ls-files '*.kt' '*.kts' | grep -v '\.g\.kt$')

  swift-lint:
    runs-on: ubuntu-latest
    # Pins the swift-format version (bundled with the toolchain as `swift format`).
    container: swift:6.4.1-bookworm
    steps:
      - uses: actions/checkout@v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: swift format --version
      # Pigeon output (*.g.swift) is committed as generated and not formatted.
      - name: Check formatting
        run: |
          files=$(git ls-files '*.swift' | grep -v '\.g\.swift$')
          swift format --in-place $files
          git diff --exit-code
      - name: swift-format lint
        if: ${{ !cancelled() }}
        run: |
          git checkout -- .
          swift format lint --strict $(git ls-files '*.swift' | grep -v '\.g\.swift$')

  android:
    runs-on: ubuntu-latest
    needs: dart
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: jdx/mise-action@v5.2.5
      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug
      - name: Kotlin unit tests (Robolectric)
        working-directory: example/android
        run: ./gradlew :advanced_webview:testDebugUnitTest

  android-integration:
    runs-on: ubuntu-latest
    needs: dart
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: jdx/mise-action@v5.2.5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: example
          script: flutter test integration_test

  ios:
    runs-on: macos-latest
    needs: dart
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
      # Swift Package Manager is Flutter's default; enable it explicitly so this
      # job keeps covering it. The `ios-cocoapods` job covers the podspec.
      - run: flutter config --enable-swift-package-manager
      - name: Build example app
        working-directory: example
        run: flutter build ios --simulator --debug
      - name: Check the plugin was built with Swift Package Manager
        working-directory: example
        run: |
          test ! -e ios/Podfile
          grep -q advanced_webview ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          find build/ios/iphonesimulator/Runner.app -path '*advanced_webview*' -name PrivacyInfo.xcprivacy | grep .
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # Runs before xcodebuild, which can leave the simulator unavailable to
      # `flutter devices` afterwards.
      # The test run sometimes hangs after the build (simulator never starts the
      # app) and used to burn the whole job timeout. Cap each attempt and retry once.
      - name: Integration tests on the simulator
        id: integration
        continue-on-error: true
        timeout-minutes: 10
        working-directory: example
        run: flutter test integration_test -d ${{ steps.simulator.outputs.udid }}
      - name: Integration tests on the simulator (retry)
        if: steps.integration.outcome != 'success'
        timeout-minutes: 10
        working-directory: example
        run: flutter test integration_test -d ${{ steps.simulator.outputs.udid }}
      - name: Swift unit tests (XCTest)
        working-directory: example/ios
        run: |
          # `flutter test` leaves Generated.xcconfig pointing at its temporary
          # test entrypoint; reset it to the app before building with Xcode.
          (cd .. && flutter build ios --config-only --simulator --debug)
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RunnerTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

  # Builds the example and runs the Swift unit tests with CocoaPods instead of
  # Swift Package Manager, so ios/advanced_webview.podspec keeps working.
  ios-cocoapods:
    runs-on: macos-latest
    needs: dart
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.5
      - run: flutter config --no-enable-swift-package-manager
      # The example references the plugin as a local Swift package
      # (../../ios/advanced_webview) so Xcode can edit its sources. That
      # package depends on ../FlutterFramework, which only exists when Flutter
      # links plugins with SwiftPM, so drop the reference to build the way a
      # regular CocoaPods app does.
      - name: Remove the plugin's local package reference
        working-directory: example/ios
        run: |
          sed -i '' '/\/\* advanced_webview \*\//d' Runner.xcodeproj/project.pbxproj
          if grep -q 'advanced_webview' Runner.xcodeproj/project.pbxproj; then exit 1; fi
      - name: Build example app
        working-directory: example
        run: flutter build ios --simulator --debug
      - name: Check the plugin was built with CocoaPods
        working-directory: example
        run: |
          grep -q 'advanced_webview (from' ios/Podfile.lock
          find build/ios/iphonesimulator/Runner.app -path '*advanced_webview*' -name PrivacyInfo.xcprivacy | grep .
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Swift unit tests (XCTest)
        working-directory: example/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:RunnerTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
