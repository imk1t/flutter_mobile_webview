name: advanced_webview
description: "A lean, type-safe WebView plugin for Android and iOS built on Pigeon."
version: 0.1.0
repository: https://github.com/imk1t/advanced_webview
issue_tracker: https://github.com/imk1t/advanced_webview/issues
documentation: https://github.com/imk1t/advanced_webview/blob/main/doc/architecture.md
topics:
  - webview
  - browser
  - pigeon
  - android
  - ios

environment:
  sdk: ^3.13.7
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Pinned exactly: the generated files record the Pigeon version, and CI fails
  # when regenerating them with a newer release. Bump together with a regeneration.
  pigeon: 29.0.12

flutter:
  plugin:
    platforms:
      android:
        package: dev.k1t.advanced_webview
        pluginClass: AdvancedWebViewPlugin
      ios:
        pluginClass: AdvancedWebViewPlugin
